name: Build

on:
  push:
    branches: [ nextgen ]
  pull_request:
    branches: [ nextgen ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/nextgen'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setting up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '21'
          cache: 'gradle'
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt
      - name: Upload artifact
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          function gradleprop {
            local value=$(grep -E "^${1}[ ]*=[ ]*" gradle.properties | head -n1 | sed -E 's/^${1}[ ]*=[ ]*//')
            if [ -z "$value" ]; then
              echo "[ERROR] gradleprop: '${1}' not found or blank in gradle.properties" >&2
              exit 1
            fi
            echo "$value"
          }
          function tomlprop {
            local value=$(grep -E "^${1}[ ]*=[ ]*" gradle/libs.versions.toml | head -n1 | sed -E 's/^${1}[ ]*=[ ]*"([^"]*)".*/\1/')
            if [ -z "$value" ]; then
              echo "[ERROR] tomlprop: '${1}' not found or blank in gradle/libs.versions.toml" >&2
              exit 1
            fi
            echo "$value"
          }
          export LB_VERSION=$(gradleprop 'mod_version')
          export MINECRAFT_VERSION=$(tomlprop 'minecraft')
          export LOADER_VERSION=$(tomlprop 'fabric-loader')
          export FABRICAPI_VERSION=$(tomlprop 'fabric-api')
          export KOTLIN_VERSION=$(tomlprop 'kotlin')
          export FABRIC_KOTLIN_VERSION=$(tomlprop 'fabric-kotlin')
          echo Version: $LB_VERSION, Minecraft: $MINECRAFT_VERSION
          cd build/libs
          export JAR=$(find . -regex '.*liquidbounce-[0-9.]*\.jar')
          if [ -z "$JAR" ]; then
            echo "[ERROR] built jar not found in build/libs" >&2
            exit 1
          fi
          cp $JAR zip/liquidbounce.jar
          cd zip
          zip -r liquidbounce.zip *
          md5sum liquidbounce.zip
          
          curl --connect-timeout 30 -m 300 -X POST -F "artifact=@liquidbounce.zip" \
            -H "Authorization: ${{ secrets.NIGHTLY_PASS }}" \
            -F "gh_id=${{ github.event.head_commit.id }}" \
            -F "gh_ref=${{ github.ref }}" \
            -F "gh_message=${COMMIT_MESSAGE}" \
            -F "gh_timestamp=${{ github.event.head_commit.timestamp }}" \
            -F "lb_version=$LB_VERSION" \
            -F "mc_version=$MINECRAFT_VERSION" \
            -F "subsystem=fabric" \
            -F "jre_version=21" \
            -F "fabric_loader_version=$LOADER_VERSION" \
            -F "fabric_api_version=$FABRICAPI_VERSION" \
            -F "kotlin_version=$KOTLIN_VERSION" \
            -F "fabric_kotlin_version=$FABRIC_KOTLIN_VERSION" \
            https://api.liquidbounce.net/api/v1/version/new

  verify-pr:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/nextgen'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setting up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '21'
          cache: 'gradle'
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          CI: true
        run: ./gradlew build
      # Make sure we always run this upload task,
      # because the previous step may fail if there are findings.
      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/detekt.sarif
