name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  extract-versions:
    runs-on: ubuntu-latest
    outputs:
      lb_version: ${{ steps.versions.outputs.lb_version }}
      jdk_version: ${{ steps.versions.outputs.jdk_version }}
      minecraft_version: ${{ steps.versions.outputs.minecraft_version }}
      loader_version: ${{ steps.versions.outputs.loader_version }}
      fabricapi_version: ${{ steps.versions.outputs.fabricapi_version }}
      kotlin_version: ${{ steps.versions.outputs.kotlin_version }}
      fabric_kotlin_version: ${{ steps.versions.outputs.fabric_kotlin_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract versions
        id: versions
        run: |
          set -euo pipefail
          
          function gradleprop {
            local key="$1"
            local value=$(grep "^${key}=" gradle.properties | head -n1 | cut -d'=' -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -z "$value" ]; then
              echo "[ERROR] gradleprop: '${key}' not found or blank in gradle.properties" >&2
              exit 1
            fi
            echo "$value"
          }
          
          function tomlprop {
            local key="$1"
            local value=$(grep "^${key}[[:space:]]*=" gradle/libs.versions.toml | head -n1 | sed -n 's/^[^=]*=[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ -z "$value" ]; then
              echo "[ERROR] tomlprop: '${key}' not found or blank in gradle/libs.versions.toml" >&2
              exit 1
            fi
            echo "$value"
          }
          
          LB_VERSION=$(gradleprop 'mod_version')
          JDK_VERSION=$(tomlprop 'jdk')
          MINECRAFT_VERSION=$(tomlprop 'minecraft')
          LOADER_VERSION=$(tomlprop 'fabric-loader')
          FABRICAPI_VERSION=$(tomlprop 'fabric-api')
          KOTLIN_VERSION=$(tomlprop 'kotlin')
          FABRIC_KOTLIN_VERSION=$(tomlprop 'fabric-kotlin')
          
          echo "lb_version=$LB_VERSION" >> "$GITHUB_OUTPUT"
          echo "jdk_version=$JDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "loader_version=$LOADER_VERSION" >> "$GITHUB_OUTPUT"
          echo "fabricapi_version=$FABRICAPI_VERSION" >> "$GITHUB_OUTPUT"
          echo "kotlin_version=$KOTLIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "fabric_kotlin_version=$FABRIC_KOTLIN_VERSION" >> "$GITHUB_OUTPUT"
          
          echo "LiquidBounce: $LB_VERSION"
          echo "JDK: $JDK_VERSION"
          echo "Minecraft: $MINECRAFT_VERSION"
          echo "Fabric Loader: $LOADER_VERSION"
          echo "Fabric API: $FABRICAPI_VERSION"
          echo "Kotlin: $KOTLIN_VERSION"
          echo "Fabric Kotlin: $FABRIC_KOTLIN_VERSION"

  build:
    runs-on: ubuntu-latest
    needs: extract-versions
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setting up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ needs.extract-versions.outputs.jdk_version }}
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt
      - name: Publish snapshot to maven.ccbluex.net
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_TOKEN_NAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN_SECRET }}
          LB_VERSION: ${{ needs.extract-versions.outputs.lb_version }}
          MINECRAFT_VERSION: ${{ needs.extract-versions.outputs.minecraft_version }}
        run: |
          set -euo pipefail

          ./gradlew publish -x test -x detekt
          ./gradlew publish -x test -x detekt \
            -Ppublish.version="${LB_VERSION}+${MINECRAFT_VERSION}-${GITHUB_SHA::7}-SNAPSHOT"
      - name: Upload artifact
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          JDK_VERSION: ${{ needs.extract-versions.outputs.jdk_version }}
          LB_VERSION: ${{ needs.extract-versions.outputs.lb_version }}
          MINECRAFT_VERSION: ${{ needs.extract-versions.outputs.minecraft_version }}
          LOADER_VERSION: ${{ needs.extract-versions.outputs.loader_version }}
          FABRICAPI_VERSION: ${{ needs.extract-versions.outputs.fabricapi_version }}
          KOTLIN_VERSION: ${{ needs.extract-versions.outputs.kotlin_version }}
          FABRIC_KOTLIN_VERSION: ${{ needs.extract-versions.outputs.fabric_kotlin_version }}
        run: |
          set -euo pipefail
          
          cd build/libs
          JAR=$(find . -regex '.*liquidbounce-[0-9.]*\.jar')
          if [ -z "$JAR" ]; then
            echo "[ERROR] built jar not found in build/libs" >&2
            exit 1
          fi
          
          cp $JAR zip/liquidbounce.jar
          cd zip
          zip -r liquidbounce.zip *
          md5sum liquidbounce.zip
          
          # The API files builds under the branch named in gh_ref; released launchers ask for nextgen
          curl --connect-timeout 30 -m 300 -X POST -F "artifact=@liquidbounce.zip" \
            -H "Authorization: ${{ secrets.NIGHTLY_PASS }}" \
            -F "gh_id=${{ github.event.head_commit.id }}" \
            -F "gh_ref=refs/heads/nextgen" \
            -F "gh_message=${COMMIT_MESSAGE}" \
            -F "gh_timestamp=${{ github.event.head_commit.timestamp }}" \
            -F "lb_version=$LB_VERSION" \
            -F "mc_version=$MINECRAFT_VERSION" \
            -F "subsystem=fabric" \
            -F "jre_version=$JDK_VERSION" \
            -F "fabric_loader_version=$LOADER_VERSION" \
            -F "fabric_api_version=$FABRICAPI_VERSION" \
            -F "kotlin_version=$KOTLIN_VERSION" \
            -F "fabric_kotlin_version=$FABRIC_KOTLIN_VERSION" \
            https://api.liquidbounce.net/api/v1/version/new

  publish-release:
    runs-on: ubuntu-latest
    needs: extract-versions
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setting up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ needs.extract-versions.outputs.jdk_version }}
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Publish release to maven.ccbluex.net
        env:
          CI: true
          MAVEN_USERNAME: ${{ secrets.MAVEN_TOKEN_NAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN_SECRET }}
        run: ./gradlew publish -x test -x detekt
      - name: Generate Script API definitions
        env:
          GH_TOKEN: ${{ secrets.LIQUIDBOUNCE_PAT }}
          VERSION: ${{ needs.extract-versions.outputs.lb_version }}+${{ needs.extract-versions.outputs.minecraft_version }}
        run: gh workflow run generate-definitions.yml -R CCBlueX/LiquidBounce-Addon-ScriptAPI -f liquidbounce="$VERSION"

  verify-pr:
    runs-on: ubuntu-latest
    needs: extract-versions
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setting up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ needs.extract-versions.outputs.jdk_version }}
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build
        env:
          CI: true
        run: ./gradlew build
      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/detekt.sarif

  gametest:
    name: gametest (${{ matrix.run }})
    runs-on: ubuntu-latest
    needs: extract-versions
    # A run with the navigation tests takes about 15 minutes; the Gradle task gives up after 30
    timeout-minutes: 40
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # `local` runs the client-only tests, the others the server tests against this anticheat:
        # https://github.com/CCBlueX/gametest/blob/main/docs/anticheats.md
        run: [local, vanilla, grim]
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setting up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Setting up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ needs.extract-versions.outputs.jdk_version }}
      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install EGL
        # The CEF add-on loads it to pick the browser's rendering, and the game renders through it below
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0
      - name: Library versions
        id: libraries
        run: echo "key=$(grep -E '^(liquidbounce-cef|djl) *=' gradle/libs.versions.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache JCEF and the deep learning engine
        uses: actions/cache@v5
        with:
          path: ~/.gradle/liquidbounce-gametest
          key: gametest-libraries-${{ runner.os }}-${{ steps.libraries.outputs.key }}
      - name: Look for navigation changes
        id: navigation
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # The engine, what drives it, its game tests, and Minecraft or library updates
          PATHS: >-
            ^(src/main/kotlin/net/ccbluex/liquidbounce/(utils/navigation/|features/global/GlobalSettingsTeleport|features/command/commands/ingame/teleport/|features/module/modules/(combat/tpaura/|combat/killaura/features/KillAuraFightBot|exploit/(ModuleTeleportReach|ReachAction)|player/ModuleAutoWalk|render/ModuleFreeCam|movement/ModuleElytraRecast|world/autofarm/AutoFarmAutoWalk|world/fucker/FuckerAutoWalk))|src/gametest/kotlin/net/ccbluex/liquidbounce/gametest/navigation/|gradle/libs\.versions\.toml)
        run: |
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -qE "$PATHS" <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Client game tests
        env:
          CI: true
          # Minecraft asks for an sRGB framebuffer, which Xvfb's GLX does not offer
          SDL_VIDEO_FORCE_EGL: 1
          # Pull requests that leave navigation alone skip its game tests, which take minutes
          NAVIGATION: ${{ steps.navigation.outputs.run }}
          # Bots join with a LiquidBounce account token; forks get none and skip the server tests
          GAMETEST_API_TOKEN: ${{ matrix.run != 'local' && secrets.API_TOKEN || '' }}
          GAMETEST_SERVER_ANTICHEAT: ${{ matrix.run != 'local' && matrix.run || '' }}
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest -PgameTestNavigation="$NAVIGATION"
      - name: Upload game test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.run }}
          # The client's log, its screenshots and what the game test server told each server test
          path: |
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/gametest/
          if-no-files-found: ignore
