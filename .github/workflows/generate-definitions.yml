name: Generate TypeScript Definitions

on:
  push:
    branches: [ nextgen ]
  # remove after testing
  pull_request:
    branches: [ nextgen ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # Updated to JDK 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create Mods Directory
        run: mkdir -p run/mods

      - name: Download ts-generator
        run: |
          mkdir -p run/LiquidBounce/scripts
          LATEST_RELEASE_URL=$(curl -s https://api.github.com/repos/CCBlueX/ts-generator/releases/latest | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url')
          curl -L $LATEST_RELEASE_URL -o run/LiquidBounce/scripts/ts-generator.zip
          unzip run/LiquidBounce/scripts/ts-generator.zip -d run/LiquidBounce/scripts/
          # Look specifically for the main jar file (excluding source jars)
          find run/LiquidBounce/scripts/ -name "*.jar" -not -name "*-sources.jar" -not -name "*-src.jar" -exec mv {} run/LiquidBounce/scripts/ts-generator.jar \; || echo "Main JAR file not found in the zip, check contents"

      - name: Copy ts-defgen.js to LiquidBounce scripts
        run: |
          cp typegen-scripts/ts-defgen.js run/LiquidBounce/scripts/

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run LiquidBounce with Gradle
        env:
          CI_BUILD: "true"  # Set the CI_BUILD flag to auto-execute ts-defgen
        run: |
          chmod +x ./gradlew
          timeout 60m xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ./gradlew runClient -Dfabric.headless=true || exit 0

      - name: Copy Generated Definitions
        run: |
          mkdir -p generated-modules
          cp -r run/LiquidBounce/scripts/types-gen generated-modules/

      - name: Find JVM Types Directory
        id: find_jvm_types
        run: |
          # Finds the first directory matching liquidbounce-script-api* inside generated-modules/types-gen/
          JVM_DIR=$(ls -d generated-modules/types-gen/liquidbounce-script-api* | head -n 1)
          echo "jvm_dir=$JVM_DIR" >> $GITHUB_OUTPUT # Output the found path

      - name: Copy Augmentations
        run: |
          # Use the found directory path
          cp -r augmentations/* ${{ steps.find_jvm_types.outputs.jvm_dir }}/augmentations

      - name: Install Generated Definitions
        run: |
          # Use the found directory path for npm install
          npm install file:${{ steps.find_jvm_types.outputs.jvm_dir }} --no-save

      - name: Compile TypeScript
        run: |
          mkdir -p dist
          tsc || exit 0

      - name: Upload TypeScript Definitions
        uses: actions/upload-artifact@v4
        with:
          name: 'liquidbounce-script-api'
          path: ${{ steps.find_jvm_types.outputs.jvm_dir }}

      - name: Upload Compiled Scripts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-scripts
          path: dist

      - name: Publish to NPM
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: ${{ steps.find_jvm_types.outputs.jvm_dir }}/package.json
          access: public
